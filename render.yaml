databases:
  - name: time-log-db
    plan: free

services:
  - type: web
    name: time-log
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: time-log-db
          property: connectionString
