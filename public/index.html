<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2f6fed" />
  <title>Учёт времени</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <nav class="tabs">
      <button class="tab active" data-view="current">Текущее</button>
      <button class="tab" data-view="tasks">Задачи</button>
      <button class="tab" data-view="today">Сегодня</button>
      <button class="tab" data-view="report">Отчёт</button>
    </nav>
  </header>

  <main>
    <!-- ===== ТЕКУЩЕЕ ===== -->
    <section id="view-current" class="view active">
      <div class="start-buttons">
        <button class="big-btn big-call" id="btn-call">Звонок</button>
        <button class="big-btn big-self" id="btn-self">Начать задачу</button>
      </div>

      <form id="call-form" class="form call-form hidden">
        <h2>Начать звонок</h2>
        <input id="call-client" list="clients-list" placeholder="Клиент" autocomplete="off" />
        <datalist id="clients-list"></datalist>
        <input id="call-task" list="tasks-list" placeholder="Задача (необязательно)" autocomplete="off" />
        <datalist id="tasks-list"></datalist>
        <button type="submit" class="btn btn-primary btn-submit">Начать звонок</button>
      </form>

      <form id="self-form" class="form hidden">
        <h2>Новая задача</h2>
        <input id="f-client" list="clients-list" placeholder="Клиент" autocomplete="off" />
        <input id="f-task" list="tasks-list" placeholder="Задача" autocomplete="off" />
        <button type="submit" class="btn btn-primary btn-submit">Поехали</button>
      </form>

      <form id="todo-form" class="form todo-form hidden">
        <h2>Новая задача</h2>
        <input id="t-client" list="clients-list" placeholder="Клиент (необязательно)" autocomplete="off" />
        <input id="t-task" placeholder="Что сделать? *" autocomplete="off" />
        <input id="t-due" type="date" placeholder="Срок (необязательно)" />
        <button type="submit" class="btn btn-primary btn-submit">Сохранить</button>
      </form>

      <div class="section-title">Незавершённое</div>
      <ul id="current-list" class="entry-list current-grid"></ul>
    </section>

    <!-- ===== ЗАДАЧИ ===== -->
    <section id="view-tasks" class="view">
      <div class="section-title">Задачи по клиентам</div>
      <div id="todos-by-client"></div>
    </section>

    <!-- ===== СЕГОДНЯ ===== -->
    <section id="view-today" class="view">
      <div class="section-title">Сегодня <span id="today-date"></span></div>
      <div class="day-total" id="day-total"></div>
      <ul id="today-list" class="entry-list"></ul>
    </section>

    <!-- ===== ОТЧЁТ ===== -->
    <section id="view-report" class="view">
      <div class="report-controls">
        <div class="range-btns">
          <button class="range active" data-range="day">День</button>
          <button class="range" data-range="week">Неделя</button>
          <button class="range" data-range="month">Месяц</button>
        </div>
        <div class="dates">
          <input type="date" id="r-from" />
          <span>—</span>
          <input type="date" id="r-to" />
          <button class="btn btn-primary" id="btn-report">Показать</button>
        </div>
        <button class="btn" id="btn-csv">Скачать CSV</button>
      </div>

      <h3>По клиентам</h3>
      <table class="rep-table" id="rep-clients"></table>

      <h3>По задачам</h3>
      <table class="rep-table" id="rep-tasks"></table>

      <h3>Записи</h3>
      <ul id="report-entries" class="entry-list"></ul>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
